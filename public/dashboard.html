<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · AestheticAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#b49dd4;--ac-l:#EEEDFE;--ac-d:#3C3489;--ac-m:#7c5ca8;--bg:#fff;--bg2:#f8f7fb;--border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.15);--t1:#1a1a1a;--t2:#555;--t3:#999}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg2);min-height:100vh;color:var(--t1);-webkit-font-smoothing:antialiased}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg);border-right:0.5px solid var(--border);padding:1.5rem 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:2rem;overflow:auto}

/* ── Sidebar ── */
.sb-logo{font-size:16px;font-weight:800;color:var(--ac-d);letter-spacing:-.02em;padding:0 1.25rem 1.5rem;border-bottom:0.5px solid var(--border);margin-bottom:1rem}
.sb-logo span{color:var(--ac)}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);padding:.4rem 1.25rem .4rem;margin-top:.5rem}
.sb-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.25rem;font-size:13px;color:var(--t2);cursor:pointer;border-radius:0;transition:all .14s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.sb-item:hover{background:var(--bg2);color:var(--t1)}
.sb-item.active{background:var(--ac-l);color:var(--ac-d);font-weight:600}
.sb-item .ico{font-size:15px;width:20px;text-align:center}
.sb-bottom{margin-top:auto;padding:1rem 1.25rem;border-top:0.5px solid var(--border)}
.sb-user{font-size:12px;color:var(--t2);margin-bottom:.75rem;line-height:1.5}
.sb-user strong{display:block;color:var(--t1);font-size:13px}
.btn-logout{width:100%;padding:8px;border-radius:8px;border:0.5px solid var(--border2);background:none;color:var(--t2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .14s}
.btn-logout:hover{background:var(--bg2)}

/* ── Page header ── */
.page-hdr{margin-bottom:1.75rem}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
.page-sub{font-size:14px;color:var(--t2);margin-top:.3rem}

/* ── Cards ── */
.card{background:var(--bg);border-radius:14px;border:0.5px solid var(--border);padding:1.5rem;margin-bottom:1.25rem}
.card-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.card-title .badge{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--ac-l);color:var(--ac-d);font-weight:600;letter-spacing:.04em}

/* ── Forms ── */
.flbl{font-size:12px;font-weight:600;color:var(--t2);display:block;margin-bottom:5px;margin-top:12px}
.flbl:first-child{margin-top:0}
.finp{width:100%;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--t1);font-size:13px;outline:none;transition:all .14s;font-family:inherit}
.finp:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-l);background:var(--bg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ── Buttons ── */
.btn-pri{padding:9px 18px;background:var(--ac-d);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .16s;font-family:inherit}
.btn-pri:hover{filter:brightness(1.1)}
.btn-sec{padding:9px 18px;background:var(--bg);color:var(--t2);border:0.5px solid var(--border2);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .16s;font-family:inherit}
.btn-sec:hover{background:var(--bg2)}
.btn-danger{padding:7px 14px;background:none;color:#c0392b;border:0.5px solid rgba(192,57,43,.3);border-radius:8px;font-size:12px;cursor:pointer;transition:all .14s;font-family:inherit}
.btn-danger:hover{background:#fff5f5}
.btn-sm{padding:6px 12px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.btn-sm:hover{background:var(--bg2)}
.btn-row{display:flex;gap:.6rem;align-items:center;margin-top:1.25rem}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--bg);border-radius:12px;border:0.5px solid var(--border);padding:.9rem 1.1rem}
.stat-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:.35rem}
.stat-val{font-size:26px;font-weight:700;color:var(--t1);letter-spacing:-.02em;line-height:1}
.stat-sub{font-size:11px;color:var(--t3);margin-top:.25rem}

/* ── Tags / chips ── */
.tag-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tag{display:inline-flex;align-items:center;gap:.35rem;padding:5px 10px;border-radius:999px;background:var(--bg2);border:0.5px solid var(--border2);font-size:12px;color:var(--t2)}
.tag .rm-tag{background:none;border:none;cursor:pointer;color:var(--t3);font-size:13px;padding:0;line-height:1;margin-left:2px}
.tag .rm-tag:hover{color:#c0392b}
.add-tag-row{display:flex;gap:.5rem;margin-top:.6rem}
.add-tag-inp{flex:1;padding:7px 10px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);font-size:12px;outline:none;font-family:inherit}
.add-tag-inp:focus{border-color:var(--ac)}

/* ── Treatments table ── */
.treat-table{width:100%;border-collapse:collapse;font-size:13px}
.treat-table th{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);padding:.5rem .75rem;text-align:left;border-bottom:0.5px solid var(--border)}
.treat-table td{padding:.65rem .75rem;border-bottom:0.5px solid var(--border);color:var(--t2);vertical-align:middle}
.treat-table tr:last-child td{border-bottom:none}
.treat-inp{width:100%;padding:5px 8px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg2);font-size:12px;outline:none;font-family:inherit}
.treat-inp:focus{border-color:var(--ac)}

/* ── Routing cards ── */
.route-options{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
.route-opt{border:1.5px solid var(--border2);border-radius:12px;padding:1rem;cursor:pointer;transition:all .16s;position:relative}
.route-opt:hover{border-color:var(--ac)}
.route-opt.selected{border-color:var(--ac-d);background:var(--ac-l)}
.route-opt-ico{font-size:22px;margin-bottom:.5rem}
.route-opt-title{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:.25rem}
.route-opt-desc{font-size:11px;color:var(--t2);line-height:1.5}
.route-check{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px}
.route-opt.selected .route-check{background:var(--ac-d);border-color:var(--ac-d);color:#fff}

/* ── Leads ── */
.leads-list{display:flex;flex-direction:column;gap:.6rem}
.lead-row{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:.85rem 1rem;display:flex;align-items:flex-start;gap:.85rem;cursor:pointer;transition:all .14s}
.lead-row:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.lead-avatar{width:36px;height:36px;border-radius:50%;background:var(--ac-l);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ac-d);flex-shrink:0}
.lead-info{flex:1;min-width:0}
.lead-name{font-size:14px;font-weight:600;color:var(--t1)}
.lead-contact{font-size:12px;color:var(--t2);margin-top:2px}
.lead-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.ltag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg2);border:0.5px solid var(--border2);color:var(--t2)}
.ltag.budget{background:var(--ac-l);color:var(--ac-d);border-color:var(--ac)}
.lead-date{font-size:11px;color:var(--t3);flex-shrink:0;white-space:nowrap}
.lead-detail{border-top:0.5px solid var(--border);margin-top:.75rem;padding-top:.75rem;display:none}
.lead-detail.open{display:block}
.dl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:.2rem;margin-top:.65rem}
.dl:first-child{margin-top:0}
.dv{font-size:13px;color:var(--t2);line-height:1.6}

/* ── Embed ── */
.code-block{background:#1a1a2e;color:#c8d6ff;border-radius:10px;padding:1.1rem 1.25rem;font-family:monospace;font-size:12px;line-height:1.7;overflow-x:auto;position:relative}
.copy-btn{position:absolute;top:10px;right:10px;padding:5px 11px;border-radius:6px;border:0.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:11px;cursor:pointer;font-family:inherit;transition:all .14s}
.copy-btn:hover{background:rgba(255,255,255,.15)}

/* ── Widget selector ── */
.widget-selector{display:flex;gap:.5rem;margin-bottom:1.5rem;align-items:center;flex-wrap:wrap}
.widget-tab{padding:7px 16px;border-radius:999px;border:0.5px solid var(--border2);background:var(--bg);font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .14s;font-family:inherit}
.widget-tab.active{background:var(--ac-d);color:#fff;border-color:var(--ac-d)}
.widget-tab:hover:not(.active){background:var(--bg2)}

/* ── Color swatch ── */
.color-row{display:flex;align-items:center;gap:.75rem;margin-top:.5rem}
.color-preview{width:32px;height:32px;border-radius:8px;border:0.5px solid var(--border2);cursor:pointer;overflow:hidden;position:relative}
.color-preview input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);opacity:0;cursor:pointer}
.color-hex{font-size:13px;font-weight:500;font-family:monospace;color:var(--t1)}

/* ── Toast ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;transition:all .25s;z-index:1000;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:none;border-top:0.5px solid var(--border);padding:.5rem;z-index:50;overflow-x:auto}
  .sb-logo,.sb-section,.sb-bottom,.sb-user{display:none}
  .sb-item{flex-direction:column;gap:.2rem;padding:.5rem .75rem;font-size:10px;border-radius:8px;min-width:60px;align-items:center}
  .sb-item .ico{font-size:20px;width:auto}
  .main{padding:1.25rem;padding-bottom:90px}
  .stats-row{grid-template-columns:1fr 1fr}
  .fgrid,.fgrid-3{grid-template-columns:1fr}
  .route-options{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-logo">Aesthetic<span>AI</span></div>
    <div class="sb-section">Manage</div>
    <button class="sb-item active" onclick="showTab('overview')" id="tab-overview">
      <span class="ico">📊</span> Overview
    </button>
    <button class="sb-item" onclick="showTab('widget')" id="tab-widget">
      <span class="ico">🎨</span> Widget Setup
    </button>
    <button class="sb-item" onclick="showTab('routing')" id="tab-routing">
      <span class="ico">📬</span> Lead Routing
    </button>
    <button class="sb-item" onclick="showTab('leads')" id="tab-leads">
      <span class="ico">👥</span> Leads
    </button>
    <button class="sb-item" onclick="showTab('embed')" id="tab-embed">
      <span class="ico">🔗</span> Embed Code
    </button>
    <button class="sb-item" onclick="showTab('billing')" id="tab-billing">
      <span class="ico">💳</span> Billing
    </button>
    <div class="sb-bottom">
      <div class="sb-user">
        <strong id="sb-clinic">—</strong>
        <span id="sb-email">—</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main-content">
    <div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--t3)">Loading…</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Auth guard ──
const token = localStorage.getItem('aiToken');
if (!token) window.location.href = '/login';

let provider = JSON.parse(localStorage.getItem('aiProvider') || '{}');
let widgets = [];
let leads = [];
let activeWidgetId = null;

function logout() {
  localStorage.removeItem('aiToken');
  localStorage.removeItem('aiProvider');
  window.location.href = '/login';
}

function toast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { logout(); return; }
  return res.json();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──
async function init() {
  const me = await api('GET', '/api/auth/me');
  if (!me || me.error) { logout(); return; }
  provider = me;
  localStorage.setItem('aiProvider', JSON.stringify(me));
  document.getElementById('sb-clinic').textContent = me.clinicName;
  document.getElementById('sb-email').textContent = me.email;

  const [w, l] = await Promise.all([api('GET', '/api/provider/widgets'), api('GET', '/api/provider/leads')]);
  widgets = w || [];
  leads = l || [];
  if (widgets.length) activeWidgetId = widgets[0].id;

  showTab('overview');
}

// ── Tab routing ──
function showTab(name) {
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  const tabEl = document.getElementById('tab-' + name);
  if (tabEl) tabEl.classList.add('active');
  const m = document.getElementById('main-content');
  const renders = { overview: renderOverview, widget: renderWidget, routing: renderRouting, leads: renderLeads, embed: renderEmbed, billing: renderBilling };
  if (renders[name]) renders[name](m);
}

// ══════════════════════════════════════
//  OVERVIEW
// ══════════════════════════════════════
function trialBanner() {
  if (provider.subscriptionStatus === 'active') return '';
  if (provider.subscriptionStatus === 'trialing' && provider.trialDaysLeft > 0) {
    return `<div style="background:linear-gradient(90deg,var(--ac-d),var(--ac-m));color:#fff;border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div>
        <div style="font-size:13px;font-weight:700">⏳ Free trial — ${provider.trialDaysLeft} day${provider.trialDaysLeft===1?'':'s'} remaining</div>
        <div style="font-size:12px;opacity:.8;margin-top:2px">Subscribe before your trial ends to keep your widget live.</div>
      </div>
      <button onclick="showTab('billing')" style="padding:8px 18px;background:#fff;color:var(--ac-d);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">Choose a plan →</button>
    </div>`;
  }
  if (provider.subscriptionStatus === 'past_due') {
    return `<div style="background:#fff5f5;border:1px solid #fbc9c9;border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div style="font-size:13px;color:#c0392b;font-weight:600">⚠️ Payment failed — please update your billing information</div>
      <button onclick="openPortal()" style="padding:8px 18px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">Update payment →</button>
    </div>`;
  }
  if (provider.subscriptionStatus === 'canceled' || (provider.subscriptionStatus === 'trialing' && provider.trialDaysLeft <= 0)) {
    return `<div style="background:#fff5f5;border:1px solid #fbc9c9;border-radius:12px;padding:.9rem 1.2rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap">
      <div style="font-size:13px;color:#c0392b;font-weight:600">🔒 Your trial has ended — subscribe to reactivate your widget</div>
      <button onclick="showTab('billing')" style="padding:8px 18px;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">Subscribe now →</button>
    </div>`;
  }
  return '';
}

function renderOverview(m) {
  const today = new Date().toDateString();
  const todayLeads = leads.filter(l => new Date(l.capturedAt).toDateString() === today).length;
  const topBudget = (() => {
    const c = {}; leads.forEach(l => { c[l.budget] = (c[l.budget]||0)+1; });
    return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—';
  })();
  const w = widgets[0];
  const widgetUrl = w ? `${location.origin}/?code=${w.code}` : '';

  m.innerHTML = `
  ${trialBanner()}
  <div class="page-hdr">
    <div class="page-title">Welcome back, ${esc(provider.clinicName)}</div>
    <div class="page-sub">Here's what's happening with your widget today.</div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-lbl">Total leads</div><div class="stat-val">${leads.length}</div><div class="stat-sub">all time</div></div>
    <div class="stat-card"><div class="stat-lbl">Today</div><div class="stat-val">${todayLeads}</div><div class="stat-sub">${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
    <div class="stat-card"><div class="stat-lbl">Widgets</div><div class="stat-val">${widgets.length}</div><div class="stat-sub">active</div></div>
    <div class="stat-card"><div class="stat-lbl">Top budget</div><div class="stat-val" style="font-size:14px;margin-top:4px">${esc(topBudget)}</div><div class="stat-sub">&nbsp;</div></div>
  </div>
  ${w ? `
  <div class="card">
    <div class="card-title">Your widget link <span class="badge">LIVE</span></div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:.75rem">Share this URL with clients or embed it on your website.</p>
    <div class="code-block" style="font-size:13px">${esc(widgetUrl)}<button class="copy-btn" onclick="copyText('${esc(widgetUrl)}')">Copy</button></div>
    <div style="display:flex;gap:.6rem;margin-top:.85rem">
      <a href="${esc(widgetUrl)}" target="_blank" class="btn-pri" style="text-decoration:none;font-size:13px;padding:9px 18px">Preview widget ↗</a>
      <button class="btn-sec" onclick="showTab('embed')">Get embed code</button>
    </div>
  </div>` : ''}
  ${leads.length ? `
  <div class="card">
    <div class="card-title">Recent leads</div>
    <div class="leads-list">${leads.slice(0,5).map(renderLeadRow).join('')}</div>
    ${leads.length > 5 ? `<button class="btn-sec" style="margin-top:.75rem" onclick="showTab('leads')">View all ${leads.length} leads →</button>` : ''}
  </div>` : `
  <div class="card" style="text-align:center;padding:2.5rem">
    <div style="font-size:32px;margin-bottom:.75rem">🌿</div>
    <div style="font-size:15px;font-weight:600;color:var(--t1);margin-bottom:.4rem">No leads yet</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:1.25rem">Share your widget link or embed it on your website to start capturing leads.</div>
    <button class="btn-pri" onclick="showTab('embed')">Get embed code</button>
  </div>`}`;
}

// ══════════════════════════════════════
//  WIDGET SETUP
// ══════════════════════════════════════
function renderWidget(m) {
  const w = widgets.find(x => x.id === activeWidgetId) || widgets[0];
  if (!w) { m.innerHTML = '<div class="page-hdr"><div class="page-title">No widget found</div></div>'; return; }
  const c = w.config || {};

  m.innerHTML = `
  <div class="page-hdr">
    <div class="page-title">Widget Setup</div>
    <div class="page-sub">Customize what your clients see and experience.</div>
  </div>
  ${widgets.length > 1 ? `
  <div class="widget-selector">
    ${widgets.map(ww => `<button class="widget-tab${ww.id===activeWidgetId?' active':''}" onclick="activeWidgetId='${ww.id}';renderWidget(document.getElementById('main-content'))">${esc(ww.name)}</button>`).join('')}
  </div>` : ''}

  <!-- Branding -->
  <div class="card">
    <div class="card-title">🎨 Branding</div>
    <div class="fgrid">
      <div>
        <label class="flbl">Clinic name</label>
        <input class="finp" id="w-name" value="${esc(c.clinicName||'')}">
      </div>
      <div>
        <label class="flbl">Booking URL</label>
        <input class="finp" id="w-booking" value="${esc(c.bookingUrl||'')}" placeholder="https://...">
      </div>
    </div>

function switchToInput(i) {
  const td = document.querySelector(`#tr-${i} td:first-child`);
  if (!td) return;
  td.innerHTML = `<div style="display:flex;gap:4px;align-items:center">
    <input class="treat-inp" id="tn-${i}" placeholder="Type treatment name…" style="flex:1" autofocus>
    <button class="btn-sm" style="font-size:10px;white-space:nowrap;padding:4px 8px" onclick="switchToSelect(${i})" title="Browse list">☰</button>
  </div>`;
  document.getElementById(`tn-${i}`)?.focus();
}

function switchToSelect(i) {
  const td = document.querySelector(`#tr-${i} td:first-child`);
  if (!td) return;
  td.innerHTML = treatNameCell('', i);
}

function getActiveWidget() { return widgets.find(x => x.id === activeWidgetId) || widgets[0]; }
function getActiveConfig() { return (getActiveWidget() || {}).config || {}; }

function removeItem(field, idx) {
  const w = getActiveWidget(); if (!w) return;
  w.config[field] = (w.config[field]||[]).filter((_,i) => i !== idx);
  saveConfig(w.id, w.config, false).then(() => renderWidget(document.getElementById('main-content')));
}

function addItem(field, inputId) {
  const val = document.getElementById(inputId)?.value.trim();
  if (!val) return;
  const w = getActiveWidget(); if (!w) return;
  if (!w.config[field]) w.config[field] = [];
  if (!w.config[field].includes(val)) w.config[field].push(val);
  document.getElementById(inputId).value = '';
  saveConfig(w.id, w.config, false).then(() => renderWidget(document.getElementById('main-content')));
}

function addTreatment() {
  const tbody = document.getElementById('treat-body'); if (!tbody) return;
  const i = tbody.querySelectorAll('tr').length;
  tbody.insertAdjacentHTML('beforeend', treatRow({ name: '', price: '', notes: '' }, i));
}

function removeTreatment(i) {
  document.getElementById(`tr-${i}`)?.remove();
  const w = getActiveWidget(); if (!w) return;
  w.config.treatments = (w.config.treatments||[]).filter((_,j)=>j!==i);
}

async function saveBranding() {
  const w = getActiveWidget(); if (!w) return;
  const color = document.getElementById('w-color').value;
  w.config.clinicName   = document.getElementById('w-name').value.trim();
  w.config.bookingUrl   = document.getElementById('w-booking').value.trim();
  w.config.logoUrl      = document.getElementById('w-logo').value.trim();
  w.config.accent       = color;
  // Auto-generate light/mid/dark from accent (simple approximation)
  w.config.accentLight  = color + '33';
  w.config.accentDark   = '#3C3489';
  w.config.accentMid    = '#7c5ca8';
  await saveConfig(w.id, w.config, true);
}

async function saveTreatments() {
  const w = getActiveWidget(); if (!w) return;
  const rows = document.querySelectorAll('#treat-body tr');
  const treatments = Array.from(rows).map(row => {
    const i = row.id.replace('tr-','');
    const nameEl = document.getElementById(`tn-${i}`);
    const name = (nameEl?.value || '').trim();
    return {
      name: name === '__custom__' ? '' : name,
      price: (document.getElementById(`tp-${i}`)?.value || '').trim(),
      notes: (document.getElementById(`td-${i}`)?.value || '').trim(),
    };
  }).filter(t => t.name);
  w.config.treatments = treatments;
  await saveConfig(w.id, w.config, true);
}

async function saveConfig(widgetId, config, showToast=true) {
  const res = await api('PUT', `/api/provider/widgets/${widgetId}`, { config });
  if (res && !res.error) {
    const idx = widgets.findIndex(x => x.id === widgetId);
    if (idx > -1) widgets[idx] = res;
    if (showToast) toast('Saved ✓');
  }
  return res;
}

function selectRoute(id) {
  document.querySelectorAll('.route-opt').forEach(el => {
    const isThis = el.querySelector('.route-opt-title').textContent.toLowerCase().includes(id==='none'?'no':id);
    el.classList.toggle('selected', false);
    el.querySelector('.route-check').textContent = '';
  });
  // simpler — just re-render with new selection
  const w = getActiveWidget(); if (!w) return;
  w._pendingRouteType = id;
  document.querySelectorAll('.route-opt').forEach((el, i) => {
    const ids = ['none','email','sms','webhook','chatbot'];
    el.classList.toggle('selected', ids[i] === id);
    el.querySelector('.route-check').textContent = ids[i] === id ? '✓' : '';
  });
  const rc = w?.routingConfig || {};
  renderRouteConfig(id, rc);
}

function renderRouteConfig(type, rc) {
  const el = document.getElementById('route-config');
  if (!el) return;
  const configs = {
    none: '',
    email: `<label class="flbl">Send notifications to this email</label>
      <input class="finp" id="rc-email" value="${esc(rc.email||'')}" placeholder="provider@yourclinic.com" type="email">`,
    sms: `<label class="flbl">Your phone number (via Twilio)</label>
      <input class="finp" id="rc-phone" value="${esc(rc.phone||'')}" placeholder="+15550001234">
      <p style="font-size:11px;color:var(--t3);margin-top:.4rem">Requires TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM set in your environment variables.</p>`,
    webhook: `<label class="flbl">Webhook URL (we'll POST lead JSON here)</label>
      <input class="finp" id="rc-url" value="${esc(rc.url||'')}" placeholder="https://hooks.zapier.com/...">

      When this is on, every new lead will automatically receive an email with their personalized treatment plan and a link to book.<br><br>
      <strong style="color:var(--ac-d)">Requires EMAIL_HOST, EMAIL_USER, and EMAIL_PASS to be set in your environment.</strong></p>`,
  };
  el.innerHTML = configs[type] || '';
}

async function saveRouting() {
  const w = getActiveWidget(); if (!w) return;
  const selectedEl = document.querySelector('.route-opt.selected');
  if (!selectedEl) return;
  const ids = ['none','email','sms','webhook','chatbot'];
  const typeIdx = Array.from(document.querySelectorAll('.route-opt')).indexOf(selectedEl);
  const routingType = ids[typeIdx] || 'none';
  const routingConfig = {
    email: document.getElementById('rc-email')?.value.trim() || w.routingConfig?.email,
    phone: document.getElementById('rc-phone')?.value.trim() || w.routingConfig?.phone,
    url:   document.getElementById('rc-url')?.value.trim()   || w.routingConfig?.url,
  };
  const res = await api('PUT', `/api/provider/widgets/${w.id}`, { routingType, routingConfig });
  if (res && !res.error) {
    const idx = widgets.findIndex(x => x.id === w.id);
    if (idx > -1) widgets[idx] = res;
    toast('Routing saved ✓');
  }
}

function renderLeads(m) {
  m.innerHTML = `
  <div class="page-hdr">
    <div class="page-title">Leads <span style="font-size:16px;font-weight:500;color:var(--t3)">(${leads.length})</span></div>
    <div class="page-sub">Every client who completed your consultation widget.</div>
  </div>
  ${leads.length ? `
  <div style="display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap">
    <input style="flex:1;min-width:180px;padding:9px 12px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg);font-size:13px;outline:none;font-family:inherit"
      placeholder="Search by name or email…" oninput="filterLeads(this.value)">
    <button class="btn-sec" onclick="exportLeads()">Export CSV</button>
  </div>
  <div class="leads-list" id="leads-list">
    ${leads.map(renderLeadRow).join('')}
  </div>` : `
  <div class="card" style="text-align:center;padding:2.5rem">
    <div style="font-size:32px;margin-bottom:.75rem">🌿</div>
    <div style="font-size:15px;font-weight:600;color:var(--t1)">No leads yet</div>
    <div style="font-size:13px;color:var(--t2);margin-top:.4rem">Share your widget to start capturing leads.</div>
  </div>`}`;

function filterLeads(q) {
  const filtered = q ? leads.filter(l =>
    `${l.fname} ${l.lname} ${l.email}`.toLowerCase().includes(q.toLowerCase())
  ) : leads;
  document.getElementById('leads-list').innerHTML = filtered.map(renderLeadRow).join('');
}

function exportLeads() {
  const cols = ['capturedAt','fname','lname','email','phone','budget','history','areas','concerns','modalities','package'];
  const rows = [cols.join(',')];
  leads.forEach(l => rows.push(cols.map(c => {
    const v = Array.isArray(l[c]) ? l[c].join('; ') : (l[c]||'');
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(',')));
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `leads-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

    <div class="card-title">📎 Direct link</div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:.75rem">Share this URL anywhere — Instagram bio, email signature, text message.</p>
    <div class="code-block">${esc(direct)}<button class="copy-btn" onclick="copyText('${esc(direct)}')">Copy</button></div>
  </div>

  <div class="card">
    <div class="card-title">🖥️ Embed on your website</div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:.75rem">Paste this HTML wherever you want the widget to appear — a landing page, a "Book now" section, or a popup trigger.</p>
    <div class="code-block">${esc(iframe)}<button class="copy-btn" onclick="copyText(\`${iframe.replace(/`/g,'\\`')}\`)">Copy</button></div>
    <p style="font-size:12px;color:var(--t3);margin-top:.75rem">The <code>allow="camera"</code> attribute lets clients upload photos from their device camera.</p>
  </div>

  <div class="card">
    <div class="card-title">🔑 Your widget code</div>
    <p style="font-size:13px;color:var(--t2);margin-bottom:.75rem">This is the unique identifier for your widget. Keep it private — it's what connects your clients to your configuration.</p>
    <div class="code-block" style="letter-spacing:.05em">${esc(w.code)}<button class="copy-btn" onclick="copyText('${esc(w.code)}')">Copy</button></div>
  </div>`;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard ✓')).catch(() => {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    toast('Copied ✓');
  });
}

// ══════════════════════════════════════
//  BILLING
// ══════════════════════════════════════
function planLabel() {
  if (provider.subscriptionStatus === 'active') {
    return `<span style="background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">● Active</span>`;
  }
  if (provider.subscriptionStatus === 'trialing') {
    return `<span style="background:var(--ac-l);color:var(--ac-d);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">◐ Trial — ${provider.trialDaysLeft} days left</span>`;
  }
  if (provider.subscriptionStatus === 'past_due') {
    return `<span style="background:#fff5f5;color:#c0392b;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">⚠ Payment failed</span>`;
  }
  return `<span style="background:var(--bg2);color:var(--t3);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700">Inactive</span>`;
}

function renderBilling(m) {
  const isActive = provider.subscriptionStatus === 'active';
  const isPro = provider.plan === 'pro';

  m.innerHTML = `
  <div class="page-hdr">
    <div class="page-title">Billing</div>
    <div class="page-sub">Manage your plan and payment details.</div>
  </div>

  <!-- Current plan status -->
  <div class="card" style="margin-bottom:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem">
      <div>
        <div style="font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:.35rem">Current plan</div>
        <div style="font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.01em;margin-bottom:.35rem">
          ${isActive ? (isPro ? 'Pro' : 'Starter') : 'Free Trial'}
        </div>
        ${planLabel()}
      </div>
      ${isActive ? `<button class="btn-sec" onclick="openPortal()">Manage billing →</button>` : ''}
    </div>
  </div>

  <!-- Plan comparison -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem">

    <!-- Starter -->
    <div class="card" style="position:relative;${!isPro&&isActive?'border-color:var(--ac-d);border-width:1.5px':''}">
      ${!isPro&&isActive?'<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ac-d);color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px">Current plan</div>':''}
      <div style="font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:.4rem">Starter</div>
      <div style="font-size:32px;font-weight:800;color:var(--t1);letter-spacing:-.02em;line-height:1">$97<span style="font-size:14px;font-weight:500;color:var(--t3)">/mo</span></div>
      <ul style="list-style:none;margin:1rem 0;display:flex;flex-direction:column;gap:.5rem">
        ${['1 widget location','200 consultations / mo','Lead capture dashboard','AI treatment recommendations','Photo analysis','Custom branding'].map(f=>`<li style="font-size:13px;color:var(--t2);display:flex;gap:.5rem"><span style="color:var(--ac-m);font-weight:700">✓</span>${f}</li>`).join('')}
      </ul>
      ${!isActive||isPro ? `<button class="btn-pri" style="width:100%" onclick="startCheckout('starter')">${isActive&&isPro?'Downgrade to Starter':'Subscribe — $97/mo'}</button>` : ''}
    </div>

    <!-- Pro -->
    <div class="card" style="position:relative;background:var(--ac-d);${isPro&&isActive?'border-color:var(--ac-d)':''}">
      ${isPro&&isActive?'<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ac-d);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px">Current plan</div>':'<div style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ac-d);font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px">Most popular</div>'}
      <div style="font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:.4rem">Pro</div>
      <div style="font-size:32px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1">$197<span style="font-size:14px;font-weight:500;color:rgba(255,255,255,.55)">/mo</span></div>
      <ul style="list-style:none;margin:1rem 0;display:flex;flex-direction:column;gap:.5rem">
        ${['Up to 5 widget locations','Unlimited consultations','Everything in Starter','AI virtual concierge chat','CSV lead export','Priority support'].map(f=>`<li style="font-size:13px;color:rgba(255,255,255,.85);display:flex;gap:.5rem"><span style="color:var(--ac);font-weight:700">✓</span>${f}</li>`).join('')}
      </ul>
      ${!isActive||!isPro ? `<button style="width:100%;padding:11px;background:#fff;color:var(--ac-d);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .16s" onclick="startCheckout('pro')" onmouseover="this.style.background='var(--ac-l)'" onmouseout="this.style.background='#fff'">${isActive&&!isPro?'Upgrade to Pro':'Subscribe — $197/mo'}</button>` : ''}
    </div>
  </div>

  <div style="font-size:12px;color:var(--t3);text-align:center">No contracts. Cancel anytime from the billing portal.</div>`;
}

async function startCheckout(plan) {
  try {
    const res = await api('POST', '/api/stripe/checkout', { plan });
    if (res?.url) window.location.href = res.url;
    else toast(res?.error || 'Could not start checkout');
  } catch {
    toast('Could not connect to billing');
  }
}

async function openPortal() {
  try {
    const res = await api('POST', '/api/stripe/portal');
    if (res?.url) window.location.href = res.url;
    else toast(res?.error || 'Could not open billing portal');
  } catch {
    toast('Could not connect to billing');
  }
}

// Handle post-payment redirect
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('upgraded') === '1') {
  history.replaceState({}, '', '/dashboard');
  setTimeout(() => toast('🎉 Subscription activated! Welcome to AestheticAI.', 4000), 500);
}

// ── Boot ──
init();
</script>
</body>
</html>
